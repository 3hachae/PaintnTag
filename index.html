<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<title>PaintnTag — 대한민국 · 일본</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-jp.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<style>
  :root {
    --bg: #F5F5F7;
    --surface: #FFFFFF;
    --surface-2: #FBFBFD;
    --text-1: #1D1D1F;
    --text-2: #6E6E73;
    --border: #D2D2D7;
    --accent: #0071E3;
    --accent-soft: #E8F1FD;
    --danger: #FF3B30;
    --map-fill: #E5E5EA;
    --map-stroke: #FFFFFF;
    --radius-sm: 8px;
    --radius-md: 14px;
    --radius-lg: 20px;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.04), 0 1px 1px rgba(0,0,0,.03);
    --shadow-md: 0 8px 28px rgba(0,0,0,.10);
    --modal-overlay: rgba(0,0,0,0.4);
  }

  body.dark-theme {
    --bg: #161618;
    --surface: #232326;
    --surface-2: #2C2C2E;
    --text-1: #F2F2F7;
    --text-2: #8E8E93;
    --border: #3A3A3C;
    --accent: #0A84FF;
    --accent-soft: rgba(10,132,255,0.2);
    --danger: #FF453A;
    --map-fill: #323236;
    --map-stroke: #161618;
    --modal-overlay: rgba(0,0,0,0.7);
  }

  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:'Pretendard', 'Pretendard JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background:var(--bg);
    color:var(--text-1);
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
    transition: background 0.3s, color 0.3s;
  }
  button, input, select, textarea{ font-family:inherit; }

  .app{height:100vh;display:flex;flex-direction:column;}

  .topbar{
    flex:none;min-height:56px;display:flex;align-items:center;justify-content:space-between;
    padding:8px 24px;background:var(--surface-2);backdrop-filter:blur(20px);
    border-bottom:1px solid var(--border);gap:12px;flex-wrap:wrap;
  }
  .brand h1{font-size:17px;font-weight:600;margin:0;letter-spacing:-0.01em;}
  .brand p{font-size:12px;color:var(--text-2);margin:2px 0 0;}
  .topbar-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text-1);border-radius:980px;padding:7px 14px;font-size:12.5px;font-weight:500;cursor:pointer;transition:all .15s;white-space:nowrap;}
  .btn-ghost:hover{background:rgba(0,0,0,.045);}
  
  .lang-select {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-1);
    border-radius: 980px;
    padding: 6px 12px;
    font-size: 12.5px;
    font-weight: 500;
    cursor: pointer;
  }

  .section-panel {
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    transition: all 0.2s ease;
    position: relative;
  }
  .panel-header-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 24px;
    background: var(--surface-2);
    border-bottom: 1px solid var(--border);
  }
  .panel-label {
    font-size: 11.5px;
    font-weight: 600;
    color: var(--text-2);
    text-transform: uppercase;
    letter-spacing: .05em;
  }
  
  .fold-toggle-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-2);
    border-radius: 6px;
    width: 24px;
    height: 24px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    cursor: pointer;
  }

  .tagbar-content { display: flex; align-items: center; gap: 14px; padding: 10px 24px; position: relative; }
  .inputbar-content { display: flex; flex-direction: column; gap: 8px; padding: 10px 24px; }

  .section-panel.collapsed .tagbar-content,
  .section-panel.collapsed .inputbar-content { display: none !important; }

  .tag-rail{display:flex;gap:8px;overflow-x:auto;flex:1;scrollbar-width:none;padding:2px;}
  .tag-rail::-webkit-scrollbar{display:none;}

  .chip{display:flex;align-items:center;gap:6px;padding:5px 8px 5px 6px;border-radius:980px;border:1.5px solid var(--border);background:var(--surface-2);flex:none;cursor:pointer;}
  .chip.active{border-color:var(--accent);background:var(--accent-soft);}
  .chip-swatch{ width:22px; height:22px; border-radius:50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.15); flex:none; cursor:pointer; }

  .chip-name{font-size:13px;font-weight:500;outline:none;padding:0 2px;min-width:14px;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-1);}
  .chip-count{ font-size:11px; color:var(--text-2); min-width:16px; padding:1px 5px; border-radius:980px; background:rgba(0,0,0,0.06); text-align:center; }
  .chip-del{border:none;background:transparent;color:var(--text-2);font-size:15px;line-height:1;width:18px;height:18px;border-radius:50%;cursor:pointer;}
  .chip-del:hover{color:var(--danger);}
  .add-tag-btn{flex:none;border:1.5px dashed var(--border);background:transparent;color:var(--text-2);border-radius:980px;padding:6px 14px;font-size:12.5px;font-weight:600;cursor:pointer;}

  .search-row{display:flex;align-items:center;gap:10px;}
  .active-tag-select-wrap{position:relative;flex:none;}
  .active-tag-select-wrap .dot{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:8px;height:8px;border-radius:50%;pointer-events:none;}
  #activeTagSelect{appearance:none;padding:8px 26px 8px 27px;border-radius:980px;border:1px solid var(--border);background:var(--surface-2);font-size:12.5px;font-weight:500;color:var(--text-1);cursor:pointer;}
  .search-wrap{position:relative;flex:1;min-width:120px;}
  #searchInput{width:100%;padding:9px 14px;border-radius:980px;border:1px solid var(--border);background:var(--surface-2);color:var(--text-1);font-size:14px;outline:none;}

  .dropdown{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-md);max-height:260px;overflow-y:auto;z-index:60;display:none;}
  .dropdown.open{display:block;}
  .dropdown-item{display:flex;align-items:center;gap:9px;padding:9px 14px;font-size:13.5px;cursor:pointer;color:var(--text-1);}
  .dropdown-item:hover{background:var(--bg);}

  .maps{flex:1;display:flex;min-height:0;}
  .map-panel{flex:1;display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--border);position:relative;}
  .map-panel:last-child{border-right:none;}

  .panel-header{flex:none;display:flex;align-items:center;justify-content:space-between;padding:10px 20px;gap:8px;}
  .panel-title{display:flex;align-items:baseline;gap:7px;}
  .panel-title h2{font-size:14px;font-weight:600;margin:0;}
  .panel-title .sub{font-size:12px;color:var(--text-2);font-weight:400;}
  .panel-tools{display:flex;gap:6px;align-items:center;}
  .icon-btn{width:28px;height:28px;border-radius:50%;border:1px solid var(--border);background:var(--surface);color:var(--text-2);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px;}
  .icon-btn:hover{background:var(--bg);color:var(--text-1);}

  .view-mode-select {
    padding: 4px 8px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text-1);
    font-size: 11.5px;
    font-weight: 500;
    cursor: pointer;
  }

  .map-canvas{flex:1;position:relative;min-height:0;}
  .map-canvas svg{width:100%;height:100%;display:block;cursor:grab;}
  .map-canvas svg:active{cursor:grabbing;}
  .map-canvas path{transition:fill .2s;cursor:pointer;vector-effect:non-scaling-stroke;}

  .clickable-title {
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 6px;
    margin-left: -6px;
    border-radius: 6px;
  }
  .clickable-title:hover { color: var(--accent); background: var(--surface-2); }
  .clickable-title::after { content: '⚙️'; font-size: 11px; margin-left: 2px; }

  .region-group-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface-2);
    margin-bottom: 8px;
  }
  .region-group-title { font-size: 13.5px; font-weight: 600; }
  .region-btn-wrap { display: flex; gap: 6px; }
  .btn-sm { padding: 4px 10px; font-size: 11.5px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; }
  .btn-sm:hover { background: var(--accent-soft); border-color: var(--accent); }

  .loading-state{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:var(--bg);color:var(--text-2);font-size:13px;z-index:10;}
  .spinner{width:22px;height:22px;border-radius:50%;border:2.5px solid var(--border);border-top-color:var(--accent);animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .modal-overlay{position:fixed;inset:0;background:var(--modal-overlay);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:500;}
  .modal-overlay.open{display:flex;}
  .modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);width:90%;max-width:440px;box-shadow:var(--shadow-md);overflow:hidden;}
  .modal-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);}
  .modal-header h3{margin:0;font-size:16px;font-weight:600;}
  .modal-close{background:transparent;border:none;font-size:20px;color:var(--text-2);cursor:pointer;}
  .modal-body{padding:20px; max-height: 70vh; overflow-y: auto;}

  .form-group{margin-bottom:14px;}
  .form-group label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--text-1);}
  .form-control{width:100%;padding:8px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);color:var(--text-1);font-size:13.5px;}

  .btn-primary{background:var(--accent);color:#fff;border:none;border-radius:980px;padding:8px 18px;font-size:12.5px;font-weight:600;cursor:pointer;}
  .btn-primary:hover{opacity:0.9;}

  .tooltip{position:fixed;z-index:100;background:rgba(29,29,31,.92);color:#fff;padding:8px 12px;border-radius:10px;font-size:12.5px;pointer-events:none;opacity:0;backdrop-filter:blur(6px);transition:opacity 0.15s;}
  .tooltip.visible{opacity:1;}
  .toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,8px);background:rgba(29,29,31,.94);color:#fff;padding:10px 18px;border-radius:980px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;z-index:600;}
  .toast.visible{opacity:1;transform:translate(-50%,0);}
</style>
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand">
      <h1>PaintnTag</h1>
      <p id="i18n-subhead">대한민국 시군구/권역 · 일본 시정촌/도도부현을 나만의 태그로 칠해보세요</p>
    </div>
    <div class="topbar-actions">
      <select class="lang-select" id="langSelect" aria-label="Language">
        <option value="ko">🌐 한국어</option>
        <option value="en">🌐 English</option>
        <option value="ja">🌐 日本語</option>
      </select>
      <button class="btn-ghost" id="themeToggleBtn">🌙 다크 모드</button>
      <button class="btn-ghost" id="resetAllBtn">🔄️ 전체 초기화</button>
      <button class="btn-ghost" id="exportBtn">⬇️ 지도 다운로드</button>
      <button class="btn-ghost" id="settingsBtn">⚙️ 설정</button>
    </div>
  </header>

  <section class="section-panel" id="tagBarSection">
    <div class="panel-header-bar">
      <span class="panel-label" id="i18n-tagmgmt">🏷️ 태그 관리</span>
      <button class="fold-toggle-btn" id="foldTagbarBtn">▲</button>
    </div>
    <div class="tagbar-content">
      <div class="tag-rail" id="tagRail"></div>
      <button class="add-tag-btn" id="addTagBtn">+ 새 태그</button>
    </div>
  </section>

  <section class="section-panel" id="inputBarSection">
    <div class="panel-header-bar">
      <span class="panel-label" id="i18n-regionsearch">🔍 지역 검색</span>
      <button class="fold-toggle-btn" id="foldInputbarBtn">▲</button>
    </div>
    <div class="inputbar-content">
      <div class="search-row">
        <div class="active-tag-select-wrap">
          <span class="dot" id="activeTagDot"></span>
          <select id="activeTagSelect" aria-label="활성 태그"></select>
        </div>
        <div class="search-wrap">
          <input type="text" id="searchInput" autocomplete="off" placeholder="서울특별시, 부산광역시, 東京都, 大阪府 등 입력">
          <div class="dropdown" id="searchDropdown"></div>
        </div>
      </div>
    </div>
  </section>

  <main class="maps">
    <section class="map-panel" id="mapPanelKR">
      <div class="panel-header">
        <div class="panel-title">
          <h2 class="clickable-title" id="titleKR" title="대한민국 권역 색칠/초기화">대한민국</h2>
          <span class="sub" id="count-kr">0개 색칠됨</span>
        </div>
        <div class="panel-tools">
          <select class="view-mode-select" id="modeSelectKR" title="지도 권역/상세 모드 변경">
            <option value="detailed" id="opt-kr-detailed">시군구 (상세)</option>
            <option value="sido" id="opt-kr-sido">17개 시·도 (광역)</option>
            <option value="region" id="opt-kr-region">8대 권역</option>
          </select>
          <button class="icon-btn" id="zoomResetKR" title="확대 초기화">🔄️</button>
          <button class="icon-btn" id="downloadKRBtn" title="이미지로 다운로드">⬇</button>
        </div>
      </div>
      <div class="map-canvas" id="map-kr">
        <div class="loading-state" id="loading-kr"><div class="spinner"></div><span id="i18n-loading-kr">지도를 불러오는 중...</span></div>
      </div>
    </section>

    <section class="map-panel" id="mapPanelJP">
      <div class="panel-header">
        <div class="panel-title">
          <h2 class="clickable-title" id="titleJP" title="일본 지도 설정">일본</h2>
          <span class="sub" id="count-jp">0개 색칠됨</span>
        </div>
        <div class="panel-tools">
          <select class="view-mode-select" id="modeSelectJP" title="지도 권역/상세 모드 변경">
            <option value="detailed" id="opt-jp-detailed">시정촌 (상세)</option>
            <option value="pref" id="opt-jp-pref">47개 도도부현 (광역)</option>
          </select>
          <button class="icon-btn" id="zoomResetJP" title="확대 초기화">🔄️</button>
          <button class="icon-btn" id="downloadJPBtn" title="이미지로 다운로드">⬇</button>
        </div>
      </div>
      <div class="map-canvas" id="map-jp">
        <div class="loading-state" id="loading-jp"><div class="spinner"></div><span id="i18n-loading-jp">지도를 불러오는 중...</span></div>
      </div>
    </section>
  </main>

</div>

<!-- 다운로드 설정 모달 -->
<div class="modal-overlay" id="downloadModal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="i18n-dl-title">지도 다운로드 설정</h3>
      <button class="modal-close" id="downloadCloseBtn">&times;</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label for="downloadTarget" id="i18n-dl-target">다운로드할 지도 선택</label>
        <select class="form-control" id="downloadTarget">
          <option value="kr" id="i18n-dl-kr">대한민국 지도</option>
          <option value="jp" id="i18n-dl-jp">일본 지도</option>
        </select>
      </div>
      <div class="form-group">
        <label for="downloadFileName" id="i18n-dl-name">파일명 입력</label>
        <input type="text" class="form-control" id="downloadFileName" value="PaintnTag_Map">
      </div>
      <div class="form-group">
        <label for="downloadFormat" id="i18n-dl-format">파일 확장자 선택</label>
        <select class="form-control" id="downloadFormat">
          <option value="png">PNG (고화질 이미지)</option>
          <option value="jpg">JPG (일반 이미지)</option>
          <option value="svg">SVG (벡터 파일)</option>
        </select>
      </div>
      <div style="text-align:right; margin-top:20px;">
        <button class="btn-primary" id="startDownloadBtn">다운로드 시작</button>
      </div>
    </div>
  </div>
</div>

<!-- 대한민국 8개 권역 일괄 선택/해제 모달 -->
<div class="modal-overlay" id="mapSelectModal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="mapSelectModalTitle">권역별 일괄 색칠 설정</h3>
      <button class="modal-close" id="mapSelectCloseBtn">&times;</button>
    </div>
    <div class="modal-body">
      <div id="mapSelectOptions"></div>
    </div>
  </div>
</div>

<!-- 설정 모달 -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="i18n-sett-title">앱 설정</h3>
      <button class="modal-close" id="settingsCloseBtn">&times;</button>
    </div>
    <div class="modal-body">
      <p style="font-size:13px; color:var(--text-2); margin-top:0;" id="i18n-sett-desc">PaintnTag 지도 맞춤 설정</p>
      <div class="form-group">
        <label id="i18n-sett-theme">테마 선택</label>
        <button class="btn-ghost" id="modalThemeToggleBtn" style="width:100%; text-align:center;">다크 모드 전환</button>
      </div>
    </div>
  </div>
</div>

<div class="tooltip" id="tooltip"></div>
<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  var KR_TOPO_URL = 'https://raw.githubusercontent.com/southkorea/southkorea-maps/master/kostat/2018/json/skorea-municipalities-2018-topo-simple.json';
  var JP_TOPO_URL = 'https://raw.githubusercontent.com/smartnews-smri/japan-topography/main/data/municipality/topojson/s0010/N03-21_210101.json';

  var I18N = {
    ko: {
      subhead: "대한민국 시군구/권역 · 일본 시정촌/도도부현을 나만의 태그로 칠해보세요",
      darkMode: "🌙 다크 모드",
      lightMode: "☀️ 라이트 모드",
      resetAll: "🔄️ 전체 초기화",
      downloadMap: "⬇️ 지도 다운로드",
      settings: "⚙️ 설정",
      tagMgmt: "🏷️ 태그 관리",
      addTag: "+ 새 태그",
      regionSearch: "🔍 지역 검색",
      searchPlaceholder: "서울특별시, 부산광역시, 東京都, 大阪府 등 입력",
      krTitle: "대한민국",
      jpTitle: "일본",
      countUnit: "개 시군구/시정촌 색칠됨",
      optKrDetailed: "시군구 (상세)",
      optKrSido: "17개 시·도 (광역)",
      optKrRegion: "8대 권역",
      optJpDetailed: "시정촌 (상세)",
      optJpPref: "47개 도도부현 (광역)",
      loading: "지도를 불러오는 중...",
      dlTitle: "지도 다운로드 설정",
      dlTarget: "다운로드할 지도 선택",
      dlKr: "대한민국 지도",
      dlJp: "일본 지도",
      dlName: "파일명 입력",
      dlFormat: "파일 확장자 선택",

  var KR_REGION_GROUPS = [

    { id: 'chungcheong', name: { ko: '충청권', en: 'Chungcheong Region', ja: '忠清圏' }, codes: ['25', '29', '33', '34'] },

  var KR_SIDO = {
    '11':['서울특별시','Seoul','ソウル特別市'], '21':['부산광역시','Busan','釜山広域市'], '22':['대구광역시','Daegu','大邱広域市'],
    '23':['인천광역시','Incheon','仁川広域市'], '24':['광주광역시','Gwangju','光州広域市'], '25':['대전광역시','Daejeon','大田広域市'],
    '26':['울산광역시','Ulsan','蔚山広域市'], '29':['세종특별자치시','Sejong','世宗特別自治市'], '31':['경기도','Gyeonggi-do','京畿道'],

    '38':['경상남도','Gyeongsangnam-do','慶尚南道'], '39':['제주특별자치도','Jeju-do','済州特別自治道']

  var svgRefs = {};

  function topologyToFeatures(topology){
    if (typeof topojson !== 'undefined' && topojson.feature) {
      var objName = Object.keys(topology.objects)[0];
      return topojson.feature(topology, topology.objects[objName]).features || [];
    }
    return [];
  }

  function regionInfo(feature, country){
    var p = feature.properties || {};
    var langIdx = state.lang === 'ko' ? 0 : (state.lang === 'en' ? 1 : 2);

    if (country === 'kr'){
      var codeStr = String(p.code || p.id || '');
      var prefix = codeStr.length >= 2 ? codeStr.slice(0,2) : codeStr;
      var name = p.name || p.name_kor || '알 수 없음';
      if (codeStr === '37310' || name === '군위군') prefix = '22';

      var sido = KR_SIDO[prefix];
      var sidoName = sido ? sido[langIdx] : '기타';
      var display = name;
      if (sido && codeStr.length > 2 && name !== sido[0]) display = sidoName + ' ' + name;

      var regionGrp = KR_REGION_GROUPS.find(function(g){ return g.codes.indexOf(prefix) !== -1; });

      return {
        key: 'kr:' + (p.code || p.id || name),
        display: display,
        shortName: name,
        prefix: prefix,
        sidoName: sidoName,
        regionGroupId: regionGrp ? regionGrp.id : 'other',
        regionGroupName: regionGrp ? (regionGrp.name[state.lang] || regionGrp.name.ko) : '기타'
      };
    } else {
      var pref = p.N03_001 || p.name || '미정성';
      var town = p.N03_004 || pref;
      var code = p.N03_007 || (pref + '_' + town);
      return {
        key: 'jp:' + code,
        display: pref + ' ' + town,
        shortName: town,
        prefName: pref
      };
    }
  }

  function loadCountry(url, country){
    return fetch(url).then(function(res){ return res.json(); }).then(function(topo){
      var features = topologyToFeatures(topo);
      return { features: features, rawTopo: topo };
    });
  }

  function getRenderFeatures(country) {
    var countryData = state.countries[country];
    if (!countryData) return [];
    var mode = state.viewMode[country];

    if (mode === 'detailed') {
      return countryData.features;
    }

    var topo = countryData.rawTopo;
    var objName = Object.keys(topo.objects)[0];
    var geometries = topo.objects[objName].geometries;
    var langIdx = state.lang === 'ko' ? 0 : (state.lang === 'en' ? 1 : 2);

    if (country === 'kr') {
      if (mode === 'sido') {
        var sidoGroups = {};
        geometries.forEach(function(g){
          var code = String(g.properties.code || g.id || '');
          var prefix = code.slice(0, 2);
          if (code === '37310' || g.properties.name === '군위군') prefix = '22';
          if (!sidoGroups[prefix]) sidoGroups[prefix] = [];
          sidoGroups[prefix].push(g);
        });

        var mergedFeatures = [];
        Object.keys(sidoGroups).forEach(function(prefix){
          var mergedGeom = topojson.merge(topo, sidoGroups[prefix]);
          var sidoInfo = KR_SIDO[prefix] || ['알 수 없음', 'Unknown', '不明'];
          mergedGeom.properties = {
            isMerged: true,
            codePrefix: prefix,
            name: sidoInfo[langIdx],
            subKeys: sidoGroups[prefix].map(function(g){ return 'kr:' + (g.properties.code || g.id || g.properties.name); })
          };
          mergedFeatures.push(mergedGeom);
        });
        return mergedFeatures;
      } else if (mode === 'region') {
        var regionGroupsMap = {};
        KR_REGION_GROUPS.forEach(function(rg){ regionGroupsMap[rg.id] = []; });

        geometries.forEach(function(g){
          var code = String(g.properties.code || g.id || '');
          var prefix = code.slice(0, 2);
          if (code === '37310' || g.properties.name === '군위군') prefix = '22';
          var rg = KR_REGION_GROUPS.find(function(r){ return r.codes.indexOf(prefix) !== -1; });
          var rId = rg ? rg.id : 'other';
          if (!regionGroupsMap[rId]) regionGroupsMap[rId] = [];
          regionGroupsMap[rId].push(g);
        });

        var mergedFeatures = [];
        KR_REGION_GROUPS.forEach(function(rg){
          var geoms = regionGroupsMap[rg.id];
          if (geoms && geoms.length) {
            var mergedGeom = topojson.merge(topo, geoms);
            mergedGeom.properties = {
              isMerged: true,
              regionId: rg.id,
              name: rg.name[state.lang] || rg.name.ko,
              subKeys: geoms.map(function(g){ return 'kr:' + (g.properties.code || g.id || g.properties.name); })
            };
            mergedFeatures.push(mergedGeom);
          }
        });
        return mergedFeatures;
      }
    } else if (country === 'jp' && mode === 'pref') {
      var prefMap = {};
      geometries.forEach(function(g){
        var pref = g.properties.N03_001 || '미정성';
        if (!prefMap[pref]) prefMap[pref] = [];
        prefMap[pref].push(g);
      });

      var mergedFeatures = [];
      Object.keys(prefMap).forEach(function(pref){
        var mergedGeom = topojson.merge(topo, prefMap[pref]);
        mergedGeom.properties = {
          isMerged: true,
          prefName: pref,
          name: pref,
          subKeys: prefMap[pref].map(function(g){
            var p = g.properties;
            var code = p.N03_007 || ((p.N03_001 || '') + '_' + (p.N03_004 || ''));
            return 'jp:' + code;
          })
        };
        mergedFeatures.push(mergedGeom);
      });
      return mergedFeatures;
    }

    return countryData.features;
  }

  function renderMap(country){
    var container = document.getElementById('map-' + country);
    if (!container) return;
    container.innerHTML = '';

    var rect = container.getBoundingClientRect();
    var width = Math.max(rect.width, 100);
    var height = Math.max(rect.height, 100);

    var renderFeatures = getRenderFeatures(country);
    
    var projection = d3.geoMercator().fitExtent([[16,16],[width-16,height-16]], { type:'FeatureCollection', features: renderFeatures });
    var pathGen = d3.geoPath(projection);

    var svg = d3.select(container).append('svg')
      .attr('viewBox', '0 0 ' + width + ' ' + height)
      .attr('preserveAspectRatio', 'xMidYMid meet');

    var g = svg.append('g');

    var tooltip = document.getElementById('tooltip');

    var paths = g.selectAll('path')
      .data(renderFeatures)
      .enter()
      .append('path')
      .attr('d', pathGen)
      .attr('fill', 'var(--map-fill)')
      .attr('stroke', 'var(--map-stroke)')
      .attr('stroke-width', country === 'jp' ? 0.4 : 0.6)
      .each(function(d){
        if (d.properties && d.properties.isMerged) {
          d._info = {
            key: country + ':merged:' + (d.properties.codePrefix || d.properties.regionId || d.properties.prefName),
            display: d.properties.name,
            subKeys: d.properties.subKeys,
            isMerged: true
          };
        } else {
          d._info = regionInfo(d, country);
        }
      })
      .on('mouseover', function(event, d){
        var t = I18N[state.lang];
        if (d._info.isMerged) {
          var count = 0;
          d._info.subKeys.forEach(function(k){ if (state.assignments[k]) count++; });
          tooltip.innerHTML = '<strong>' + d._info.display + '</strong><br>' + t.selectedCount + count + ' / ' + d._info.subKeys.length;
        } else {
          var tagId = state.assignments[d._info.key];
          var tag = state.tags.find(function(tg){ return tg.id === tagId; });
          tooltip.innerHTML = '<strong>' + d._info.display + '</strong>' + (tag ? '<br>' + tag.name : '');
        }
        tooltip.classList.add('visible');
      })
      .on('mousemove', function(event){
        tooltip.style.left = (event.clientX + 12) + 'px';
        tooltip.style.top = (event.clientY + 12) + 'px';
      })
      .on('mouseout', function(){
        tooltip.classList.remove('visible');
      })
      .on('click', function(event, d){
        if (!state.activeTagId) return;

        if (d._info.isMerged) {
          var allSame = d._info.subKeys.every(function(k){ return state.assignments[k] === state.activeTagId; });
          d._info.subKeys.forEach(function(k){
            if (allSame) delete state.assignments[k];
            else state.assignments[k] = state.activeTagId;
          });
        } else {
          if (state.assignments[d._info.key] === state.activeTagId) delete state.assignments[d._info.key];
          else state.assignments[d._info.key] = state.activeTagId;
        }

        applyColors(country);
        updateCounts();
      });

    var zoom = d3.zoom().scaleExtent([1, 30]).on('zoom', function(e){ g.attr('transform', e.transform); });
    svg.call(zoom);

    svgRefs[country] = { svg: svg, paths: paths, zoom: zoom, g: g };
    applyColors(country);
  }

  function applyColors(country){
    var ref = svgRefs[country];
    if (!ref) return;

    ref.paths.attr('fill', function(d){
      if (d._info.isMerged) {
        var counts = {};
        var maxCount = 0;
        var dominantTagId = null;

        d._info.subKeys.forEach(function(k){
          var tid = state.assignments[k];
          if (tid) {
            counts[tid] = (counts[tid] || 0) + 1;
            if (counts[tid] > maxCount) {
              maxCount = counts[tid];
              dominantTagId = tid;
            }
          }
        });

        if (dominantTagId) {
          var tag = state.tags.find(function(t){ return t.id === dominantTagId; });
          return tag ? tag.color : 'var(--map-fill)';
        }
        return 'var(--map-fill)';
      } else {
        var tagId = state.assignments[d._info.key];
        var tag = state.tags.find(function(t){ return t.id === tagId; });
        return tag ? tag.color : 'var(--map-fill)';
      }
    });
  }

  function updateCounts(){
    ['kr', 'jp'].forEach(function(c){
      var n = Object.keys(state.assignments).filter(function(k){ return k.indexOf(c + ':') === 0; }).length;
      document.getElementById('count-' + c).textContent = n + I18N[state.lang].countUnit;

  // --- 지도 다운로드 ---
  function exportMapFile(country, fileName, format) {
    var svgEl = document.querySelector('#map-' + country + ' svg');
    if (!svgEl) return;

    var finalFileName = (fileName.trim() || "PaintnTag_Map") + "." + format;
    var serializer = new XMLSerializer();
    var svgString = serializer.serializeToString(svgEl);

    if (format === 'svg') {
      var blob = new Blob([svgString], { type: "image/svg+xml;charset=utf-8" });
      var link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = finalFileName;
      link.click();
      showToast("SVG " + I18N[state.lang].downloadSaved);
      return;
    }

    var canvas = document.createElement("canvas");
    var rect = svgEl.getBoundingClientRect();
    var scale = 2;
    canvas.width = (rect.width || 800) * scale;
    canvas.height = (rect.height || 600) * scale;
    var ctx = canvas.getContext("2d");

    var img = new Image();
    var svgBlob = new Blob([svgString], { type: "image/svg+xml;charset=utf-8" });
    var url = URL.createObjectURL(svgBlob);

    img.onload = function() {
      ctx.fillStyle = document.body.classList.contains('dark-theme') ? "#161618" : "#F5F5F7";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.scale(scale, scale);
      ctx.drawImage(img, 0, 0);

      var mimeType = (format === 'jpg') ? 'image/jpeg' : 'image/png';
      var dataUrl = canvas.toDataURL(mimeType, 0.95);
      
      var link = document.createElement("a");
      link.href = dataUrl;
      link.download = finalFileName;
      link.click();
      URL.revokeObjectURL(url);
      showToast(format.toUpperCase() + I18N[state.lang].downloadSaved);
    };
    img.src = url;
  }

  });
  document.getElementById('zoomResetJP').addEventListener('click', function(){
    if (svgRefs.jp) svgRefs.jp.svg.transition().duration(500).call(svgRefs.jp.zoom.transform, d3.zoomIdentity);
  });

  document.getElementById('modeSelectKR').addEventListener('change', function(e){
    state.viewMode.kr = e.target.value;
    renderMap('kr');
  });
  document.getElementById('modeSelectJP').addEventListener('change', function(e){
    state.viewMode.jp = e.target.value;
    renderMap('jp');
  });

  function toggleTheme(){
    document.body.classList.toggle('dark-theme');
    var isDark = document.body.classList.contains('dark-theme');
    var t = I18N[state.lang];
    document.getElementById('themeToggleBtn').textContent = isDark ? t.lightMode : t.darkMode;
    document.getElementById('modalThemeToggleBtn').textContent = isDark ? t.lightMode : t.darkMode;
  }
  document.getElementById('themeToggleBtn').addEventListener('click', toggleTheme);
  document.getElementById('modalThemeToggleBtn').addEventListener('click', toggleTheme);

  document.getElementById('settingsBtn').addEventListener('click', function(){
    document.getElementById('settingsModal').classList.add('open');
  });
  document.getElementById('settingsCloseBtn').addEventListener('click', function(){
    document.getElementById('settingsModal').classList.remove('open');
  });

  document.getElementById('titleKR').addEventListener('click', function(){ openCountryModal('kr'); });
  document.getElementById('titleJP').addEventListener('click', function(){ openCountryModal('jp'); });
  document.getElementById('mapSelectCloseBtn').addEventListener('click', function(){
    document.getElementById('mapSelectModal').classList.remove('open');
  });

  function openCountryModal(country) {
    var t = I18N[state.lang];
    document.getElementById('mapSelectModalTitle').textContent = (country === 'kr' ? '🇰🇷 ' + t.krTitle + ' ' + t.optKrRegion : '🇯🇵 ' + t.jpTitle);
    var container = document.getElementById('mapSelectOptions');
    container.innerHTML = '';

    if (country === 'kr') {
      KR_REGION_GROUPS.forEach(function(g, idx){
        var groupName = g.name[state.lang] || g.name.ko;
        var card = document.createElement('div');
        card.className = 'region-group-card';
        card.innerHTML = 
          '<span class="region-group-title">' + (idx + 1) + '. ' + groupName + '</span>' +
          '<div class="region-btn-wrap">' +
            '<button class="btn-sm" data-action="paint" data-id="' + g.id + '">' + t.paintAll + '</button>' +
            '<button class="btn-sm" data-action="clear" data-id="' + g.id + '">' + t.clearAll + '</button>' +
          '</div>';

        card.querySelector('[data-action="paint"]').addEventListener('click', function(){
          colorRegionGroup(g, state.activeTagId);
        });
        card.querySelector('[data-action="clear"]').addEventListener('click', function(){
          colorRegionGroup(g, null);
        });

        container.appendChild(card);
      });
    } else {
      container.innerHTML = '<p style="font-size:13px; color:var(--text-2);">' + t.optJpPref + '</p>';
    }
    document.getElementById('mapSelectModal').classList.add('open');
  }

  function colorRegionGroup(group, tagId) {
    if (!state.countries.kr) return;
    state.countries.kr.features.forEach(function(f){
      var info = regionInfo(f, 'kr');
      if (group.codes.indexOf(info.prefix) !== -1) {
        if (tagId) state.assignments[info.key] = tagId;
        else delete state.assignments[info.key];
      }
    });
    applyColors('kr');
    updateCounts();
  }

  // --- 태그 관리 기능 ---
  document.getElementById('addTagBtn').addEventListener('click', function(){
    var t = I18N[state.lang];
    var name = prompt(t.tagPrompt, t.tagDefault + (state.tags.length + 1));
    if (name) {
      var colors = ['#0071E3', '#FF9500', '#34C759', '#AF52DE', '#FF3B30', '#5856D6', '#00C7BE'];
      var randomColor = colors[Math.floor(Math.random() * colors.length)];
      var newTag = { id: 't' + Date.now(), name: name, color: randomColor };
      state.tags.push(newTag);
      state.activeTagId = newTag.id;
      renderTags();
    }
  });

  function renderTags(){
    var rail = document.getElementById('tagRail');
    var select = document.getElementById('activeTagSelect');
    rail.innerHTML = ''; select.innerHTML = '';

    state.tags.forEach(function(tag){
      var chip = document.createElement('div');
      chip.className = 'chip' + (tag.id === state.activeTagId ? ' active' : '');
      
      var count = Object.values(state.assignments).filter(function(v){ return v === tag.id; }).length;

      chip.innerHTML = 
        '<div class="chip-swatch" style="background:' + tag.color + '" title="Color"></div>' +
        '<span class="chip-name">' + tag.name + '</span>' +
        '<span class="chip-count">' + count + '</span>' +
        (state.tags.length > 1 ? '<button class="chip-del">&times;</button>' : '');

      chip.querySelector('.chip-swatch').addEventListener('click', function(e){
        e.stopPropagation();
        var newColor = prompt(I18N[state.lang].colorPrompt, tag.color);
        if (newColor) { tag.color = newColor; renderTags(); applyColors('kr'); applyColors('jp'); }
      });

      chip.addEventListener('click', function(){
        state.activeTagId = tag.id;
        renderTags();
      });

      var delBtn = chip.querySelector('.chip-del');
      if (delBtn) {
        delBtn.addEventListener('click', function(e){
          e.stopPropagation();
          if (confirm("'" + tag.name + "'" + I18N[state.lang].tagDelConfirm)) {
            state.tags = state.tags.filter(function(t){ return t.id !== tag.id; });
            Object.keys(state.assignments).forEach(function(k){
              if (state.assignments[k] === tag.id) delete state.assignments[k];
            });
            if (state.activeTagId === tag.id) state.activeTagId = state.tags[0].id;
            renderTags();
            applyColors('kr');
            applyColors('jp');
            updateCounts();
          }
        });
      }

      rail.appendChild(chip);

      var opt = document.createElement('option');
      opt.value = tag.id; opt.textContent = tag.name;
      if(tag.id === state.activeTagId) opt.selected = true;
      select.appendChild(opt);
    });

    var activeTag = state.tags.find(function(t){ return t.id === state.activeTagId; });
    document.getElementById('activeTagDot').style.background = activeTag ? activeTag.color : 'transparent';
  }

  document.getElementById('activeTagSelect').addEventListener('change', function(e){
    state.activeTagId = e.target.value;
    renderTags();
  });

  // --- 지역 검색 기능 ---
  var searchInput = document.getElementById('searchInput');
  var searchDropdown = document.getElementById('searchDropdown');

  searchInput.addEventListener('input', function(){
    var query = this.value.trim().toLowerCase();
    if (!query) { searchDropdown.classList.remove('open'); return; }

    var results = [];
    ['kr', 'jp'].forEach(function(c){
      if (!state.countries[c]) return;
      state.countries[c].features.forEach(function(f){
        var info = regionInfo(f, c);
        if (info.display.toLowerCase().indexOf(query) !== -1 || info.shortName.toLowerCase().indexOf(query) !== -1) {
          results.push({ country: c, info: info, feature: f });
        }
      });
    });

    searchDropdown.innerHTML = '';
    if (results.length === 0) {
      searchDropdown.innerHTML = '<div class="dropdown-item" style="color:var(--text-2);">' + I18N[state.lang].noResult + '</div>';
    } else {
      results.slice(0, 15).forEach(function(res){
        var item = document.createElement('div');
        item.className = 'dropdown-item';
        item.innerHTML = '<span>' + (res.country === 'kr' ? '🇰🇷' : '🇯🇵') + '</span> <span>' + res.info.display + '</span>';
        item.addEventListener('click', function(){
          if (state.activeTagId) {
            state.assignments[res.info.key] = state.activeTagId;
            applyColors(res.country);
            updateCounts();
            showToast(res.info.display);
          }
          searchDropdown.classList.remove('open');
          searchInput.value = '';
        });
        searchDropdown.appendChild(item);
      });
    }
    searchDropdown.classList.add('open');
  });

  document.addEventListener('click', function(e){
    if (!searchInput.contains(e.target) && !searchDropdown.contains(e.target)) {
      searchDropdown.classList.remove('open');
    }
  });

  function showToast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('visible');
    setTimeout(function(){ t.classList.remove('visible'); }, 2000);
  }

  // 접기/펴기
  document.getElementById('foldTagbarBtn').addEventListener('click', function(){
    document.getElementById('tagBarSection').classList.toggle('collapsed');
    this.textContent = document.getElementById('tagBarSection').classList.contains('collapsed') ? '▼' : '▲';
  });
  document.getElementById('foldInputbarBtn').addEventListener('click', function(){
    document.getElementById('inputBarSection').classList.toggle('collapsed');
    this.textContent = document.getElementById('inputBarSection').classList.contains('collapsed') ? '▼' : '▲';
  });

  // 초기화 및 지도 데이터 로딩
  Promise.all([
    loadCountry(KR_TOPO_URL, 'kr'),
    loadCountry(JP_TOPO_URL, 'jp')
  ]).then(function(res){
    state.countries.kr = res[0];
    state.countries.jp = res[1];
    document.getElementById('loading-kr').style.display = 'none';
    document.getElementById('loading-jp').style.display = 'none';
    applyLanguage('ko');
    renderTags();
  });

})();
</script>
</body>
</html>
